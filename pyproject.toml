[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ailias"
version = "0.1.0"
description = "Local, manual-first photo-to-MetaHuman workflow"
requires-python = ">=3.12"
dependencies = ["Pillow>=12.3,<13"]

[project.optional-dependencies]
geometry = ["numpy>=2,<3"]
imageprocessing = [
    "numpy>=2,<3",
    "opencv-python-headless>=4.13,<5",
    "pillow-heif>=1,<2",
]
gpu = ["numpy>=2,<3", "pillow-heif>=1,<2"]

[project.scripts]
ailias = "ailias.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*", "integration_tests", "integration_tests.*"]
